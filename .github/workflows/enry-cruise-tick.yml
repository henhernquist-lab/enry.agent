# Enry Cruise — schedule tick.
#
# Drives Cruise Auto-run: pings the deployed app's /api/cron/cruise-tick every
# ~15 min. The endpoint evaluates each Auto-run-enabled repo's DST-safe schedule
# and dispatches any that are due. Hosted here (not a Vercel cron) so it works on
# Vercel Hobby, is free, and survives redeploys.
#
# GitHub's scheduler is best-effort — a run can land 5–15 min late (occasionally
# more under load), so wall-clock precision is ~quarter-hour, not exact.
#
# Configuration:
#   CRON_SECRET — repo SECRET (Settings > Secrets and variables > Actions > Secrets).
#                 Must match the app's CRON_SECRET env var. Genuinely secret.
#   DEPLOY_URL  — optional repo VARIABLE (same page, Variables tab). Only needed to
#                 override the default below; a public base URL is not secret, so it
#                 is not stored as one. Previously this read secrets.DEPLOY_URL,
#                 which was never set: it expanded to an empty string and every run
#                 failed with "curl: (3) URL rejected: No host part in the URL".
name: Enry Cruise — schedule tick

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Never overlap ticks.
concurrency:
  group: enry-cruise-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # These crons ran red for a week because an unset secret expands to an
      # empty string rather than erroring — the failure surfaced only as
      # "curl: (3) URL rejected: No host part in the URL". Fail with the actual
      # cause instead.
      - name: Check CRON_SECRET is configured
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET repo secret is not set (Settings > Secrets and variables > Actions). It must match the app's CRON_SECRET env var, or the endpoint returns 401."
            exit 1
          fi
          echo "CRON_SECRET is set."

      - name: Ping Cruise tick endpoint
        run: |
          code=$(curl -sS -o /tmp/tick.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.DEPLOY_URL || 'https://golemhq.vercel.app' }}/api/cron/cruise-tick")
          echo "HTTP $code"
          cat /tmp/tick.json 2>/dev/null || true
          echo
          test "$code" = "200"
